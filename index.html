<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aprende AppSheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#152039;--hud:#0f1830;--y:#ffc83d;--y2:#f0a800;--teal:#14b39a;--coral:#ff6b57;--ok:#1f9d55;--ok-soft:#e3f6ea;--bad:#d9472f;--bad-soft:#fff0ea;--muted:#5a6683;--line:#dfe4ef;--g:#1a73e8}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Rubik,system-ui,Arial,sans-serif;color:var(--ink);background:var(--hud);font-size:16px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
code{font-family:ui-monospace,Consolas,monospace}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column}

/* HUD */
.hud{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--hud);color:#fff;border-bottom:3px solid #000}
.hb{display:flex;align-items:center;gap:8px;background:#1d2a4d;border:2px solid #31406b;border-radius:12px;padding:6px 12px;color:#fff;font-weight:600;font-size:14px;white-space:nowrap}
.hb:hover{background:#26365f}
.hb svg{width:20px;height:20px;flex:0 0 auto}
.hb.ic{padding:6px 8px}
.hinfo{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.hinfo b{font-weight:800;font-size:16px;letter-spacing:.01em;white-space:nowrap}
.hinfo small{color:#9fb0d8;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpw{margin-left:auto;display:flex;align-items:center;gap:10px}
.xpbar{width:180px;height:14px;background:#22305a;border:2px solid #000;border-radius:99px;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--y));transition:width .7s}
.xp{position:relative;font-weight:800;color:var(--y);font-size:15px;white-space:nowrap}
.xpf{position:absolute;right:0;top:-16px;color:var(--y);font-weight:800;animation:xpf 1s forwards;pointer-events:none}
@keyframes xpf{to{transform:translateY(-26px);opacity:0}}
.chatb{padding:3px 12px 3px 3px;background:var(--y);border-color:#000;color:var(--ink)}
.chatb:hover{background:#ffd666}
.chatb svg{width:32px;height:32px}

main{flex:1;min-height:0;position:relative;overflow:hidden}
.foot{flex:0 0 auto;text-align:center;font-size:13px;color:#9fb0d8;background:var(--hud);padding:6px 12px;border-top:3px solid #000}
.foot b{color:var(--y)}

/* Escenarios */
.sky1{background:linear-gradient(180deg,#7cc8f7 0%,#bfe6ff 55%,#e6f7ec 100%)}
.sky2{background:linear-gradient(180deg,#ff9f68 0%,#ff7f7a 40%,#8a63c9 100%)}
.sky3{background:linear-gradient(180deg,#0a1130 0%,#1a2759 60%,#2a3d78 100%)}
.scene{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.scene svg{width:100%;height:100%;display:block}
.cloud{animation:drift 40s linear infinite}
.cloud.b{animation-duration:65s}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(1300px)}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}

/* Mapa */
.mapv{overflow-y:auto;height:100%}
.zone{position:relative;padding:34px 16px 120px;min-height:480px}
.zin{position:relative;max-width:760px;margin:auto}
.mhero{display:flex;gap:20px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:18px 22px;margin-bottom:34px}
.mhero .av{width:104px;height:104px;flex:0 0 auto}
.mhero h1{margin:0;font-size:clamp(28px,4.5vw,40px);line-height:1.05;font-weight:800;letter-spacing:-.01em}
.mhero p{margin:6px 0 12px;color:var(--muted);font-size:15.5px}
.mhero .row2{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ztitle{display:inline-flex;flex-direction:column;background:var(--ink);color:#fff;border-radius:14px;padding:8px 16px;border:3px solid #000;box-shadow:0 4px 0 #000;margin-bottom:22px}
.ztitle b{font-size:18px;font-weight:800;color:var(--y);letter-spacing:.04em;text-transform:uppercase}
.ztitle small{color:#c7d2ee;font-size:13px}
.path{display:flex;flex-direction:column;align-items:center;gap:6px}
.node{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;transform:translateX(var(--x));position:relative}
.nb{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:800;background:#fff;color:var(--ink);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);transition:transform .15s}
.node:hover:not(:disabled) .nb{transform:translateY(-3px)}
.node.done .nb{background:var(--teal);color:#fff}
.node.cur .nb{background:var(--y);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 var(--ink),0 0 0 0 rgba(255,200,61,.7)}50%{box-shadow:0 6px 0 var(--ink),0 0 0 14px rgba(255,200,61,0)}}
.node:disabled{cursor:not-allowed}
.node:disabled .nb{background:#cfd6e6;color:#8590ab;border-color:#55617f;box-shadow:0 6px 0 #55617f}
.nl{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:2px 10px;font-weight:700;font-size:14px;margin-top:6px}
.node:disabled .nl{opacity:.75}
.ns{color:#ffb800;font-size:14px;letter-spacing:2px;height:18px;text-shadow:0 1px 0 #00000040}
.dots3{display:flex;flex-direction:column;gap:6px;align-items:center;padding:4px 0}
.dots3 i{width:8px;height:8px;border-radius:50%;background:#ffffffcc;border:2px solid var(--ink)}
.sky3 .dots3 i{background:#ffffff55}
.trophy .nb{width:86px;height:86px;font-size:34px;background:#fff6d6}
.resetl{display:block;margin:26px auto 0;background:none;border:0;color:#c7d2ee;text-decoration:underline;font-size:14px}

/* Botones tipo juego */
.gbtn{background:var(--y);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);font-weight:800;font-size:15.5px;padding:9px 18px;transition:transform .08s,box-shadow .08s;white-space:nowrap}
.gbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.gbtn.w{background:#fff}
.gbtn.t{background:var(--teal);color:#fff}
.lbtn{background:none;border:0;padding:6px 4px;color:var(--muted);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* Etapa */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 410px}
.simarea{position:relative;overflow:auto;padding:24px;display:flex;min-height:0}
.device{margin:auto;width:100%;min-width:0;max-width:860px;background:#1b2440;border:3px solid #000;border-radius:24px;padding:10px;box-shadow:0 22px 50px rgba(5,10,30,.35)}
.simwrap{min-width:0;position:relative;overflow:hidden;border-radius:14px;background:#fff}
.spot{position:absolute;border-radius:12px;pointer-events:none;opacity:0;box-shadow:0 0 0 4px var(--y),0 0 0 9999px rgba(8,14,34,.55);transition:left .45s,top .45s,width .45s,height .45s,opacity .3s;z-index:5}
.spot.on{opacity:1}
.ptr{position:absolute;width:34px;height:40px;z-index:6;pointer-events:none;opacity:0;transition:left .45s,top .45s,opacity .3s}
.ptr.on{opacity:1}
.ptr svg{width:100%;height:100%;animation:tap 1s ease-in-out infinite;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
@keyframes tap{50%{transform:translate(-7px,-7px)}}
.card{position:absolute;inset:0;z-index:7;background:#fff;padding:22px 24px;overflow:auto;animation:cardin .35s}
@keyframes cardin{from{transform:translateY(16px);opacity:0}}
.card h3{margin:0 0 4px;font-size:20px;font-weight:800}
.card .sub{margin:0 0 14px;color:var(--muted);font-size:14px}
.card table{border-collapse:collapse;width:100%;font-size:14px}
.card th,.card td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.card th{background:#f2f5fb;font-weight:700;font-size:13px;color:var(--muted)}
.card td:first-child{font-weight:700;white-space:nowrap}
.card code{background:#f1effd;color:#3c2fb8;padding:1px 6px;border-radius:5px;font-size:13px}

.comp{position:relative;overflow-y:auto;padding:20px 20px 22px 4px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;min-height:0}
.portrait{width:128px;height:128px;align-self:flex-start;margin-left:14px;margin-bottom:-26px;position:relative;z-index:2;flex:0 0 auto}
.portrait svg{width:100%;height:100%;border-radius:50%;border:4px solid var(--ink);background:#fff;box-shadow:0 5px 0 var(--ink)}
.portrait.hop{animation:hop .5s}
.portrait.no{animation:no .4s}
@keyframes hop{40%{transform:translateY(-14px)}}
@keyframes no{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.dlg{position:relative;background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:26px 20px 16px;flex:0 0 auto}
.tag{position:absolute;top:-17px;right:16px;display:flex;align-items:center;gap:6px;background:var(--y);border:3px solid var(--ink);border-radius:12px;padding:2px 12px;font-weight:800;font-size:14px}
.tag svg{display:none;width:24px;height:24px;margin-left:-6px}
.say{margin:0;font-size:17px;line-height:1.55;min-height:3.1em}
.qq{margin:0;font-size:17px;font-weight:700;line-height:1.45}
.ctrl{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.ctrl .sp{flex:1}
.dots{display:flex;gap:5px;flex-basis:100%;margin-bottom:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:#d5dbea}
.dots i.on{background:var(--ink);width:20px;border-radius:99px}
.spk{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:#fff;display:grid;place-items:center;padding:0}
.spk svg{width:20px;height:20px}
.spk.on{background:var(--y);border-color:var(--ink)}
.fb{font-size:15.5px;line-height:1.5;border-radius:12px;margin-top:10px}
.fb:empty{display:none}
.fb{padding:10px 12px}
.fb.good{background:var(--ok-soft);color:#16653a}
.fb.bad{background:var(--bad-soft);color:#9c2e1a}
.fb.tip{background:#fff6d8;color:#6e5100}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:#fff;border:3px solid #cfd6e6;border-radius:14px;box-shadow:0 3px 0 #cfd6e6;padding:11px 14px;font-weight:600;font-size:15.5px;transition:border-color .12s,transform .08s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:active:not(:disabled){transform:translateY(2px)}
.opt:disabled{cursor:default}
.opt.code{font-family:ui-monospace,Consolas,monospace;font-size:13.5px;font-weight:500;word-break:break-word}
.opt.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 3px 0 var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad);opacity:.85}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.rel{display:grid;grid-template-columns:1fr auto 1.2fr;gap:14px;align-items:center;padding:22px 20px;background:#f6f8fc;font-size:13px}
.rt{background:#fff;border:2px solid #dfe4ef;border-radius:12px;padding:10px 12px;overflow-x:auto}
.rt h5{margin:0 0 6px;font-size:15px}
.rt h5 small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.rt table{border-collapse:collapse;width:100%}
.rt th,.rt td{padding:6px 6px;border-bottom:1px solid #eef1f6;text-align:left;white-space:nowrap}
.rt th{font-size:11px;color:var(--muted);font-weight:600}
.rt th em{font-style:normal;background:#152039;color:#fff;border-radius:4px;padding:0 4px;font-size:10px}
.rchip{display:inline-block;color:#fff;font-weight:700;border-radius:6px;padding:2px 7px;font-size:12px}
.rchip.glow{animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(124,108,255,.35);transform:scale(1.08)}}
.rmid{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;padding:6px}
.rmid svg{width:56px;height:20px}
.rmid b{background:var(--y);border:2px solid var(--ink);border-radius:8px;padding:0 8px}
.card .rule{margin:14px 0 0;background:#fff6d8;border-radius:10px;padding:10px 12px;font-size:14px}
.dd{border:1.5px solid #1a73e8;border-radius:6px;margin-top:3px;overflow:hidden}
.dd div{padding:4px 6px;border-bottom:1px solid #eee;font-size:10.5px}
.dd div:first-child{background:#e8f0fe;font-weight:700}
.hunt .rt tr[data-hot]:hover td{background:#fff4cc;cursor:pointer}
@media (max-width:640px){.rel{grid-template-columns:1fr;padding:12px}.rmid{flex-direction:row;justify-content:center}.rmid svg{transform:rotate(90deg);width:40px}}
.ph-body{position:relative}
.plus{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;background:#1a73e8;color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700;box-shadow:0 3px 8px rgba(0,0,0,.25);z-index:2}
.flow{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px;padding:20px;background:#f6f8fc}
.fcol{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px;border-radius:14px}
.fname{background:var(--ink);color:#fff;font-weight:700;font-size:12px;border-radius:8px;padding:2px 10px}
.flab{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted)}
.flab svg{width:40px;height:16px}
.ebtns{display:flex;gap:4px;border:0!important}
.ebtns span{flex:1;text-align:center;border:1.5px solid #1a73e8;border-radius:6px;padding:4px 2px;color:#1a73e8;font-weight:600;font-size:10px}
.ebtns span.on{background:#1a73e8;color:#fff}
.turnos{display:flex;gap:12px;justify-content:center;margin:4px 0 16px}
.turnos div{display:flex;flex-direction:column;align-items:center;gap:4px}
.tk{background:#fff6d8;border:2px dashed var(--ink);border-radius:8px;padding:8px 14px;font-weight:800;font-size:18px}
.turnos small{color:var(--muted)}
.resta{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:10px 0}
.resta div{display:flex;flex-direction:column;align-items:center;background:#f2f5fb;border-radius:12px;padding:10px 16px}
.resta div.r{background:var(--y);border:2px solid var(--ink)}
.resta b{font-size:28px;font-weight:800}
.resta small{color:var(--muted);font-size:12px}
.resta div.r small{color:var(--ink)}
.resta span{font-size:28px;font-weight:800}
.who{display:block;margin:6px 0 0;color:var(--muted);font-size:15px}
.nm{display:block;margin:6px auto 0 0;font:inherit;font-size:16px;padding:9px 12px;border:3px solid var(--ink);border-radius:12px;width:min(280px,100%)}
.mhero .nm{margin:6px 0 0}
.gbtn:disabled{opacity:.5;cursor:not-allowed}
.ruta,.qrflow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.ruta div,.qrflow>div{display:flex;flex-direction:column;align-items:center;background:#f2f5fb;border-radius:12px;padding:10px 12px;text-align:center;gap:2px}
.ruta div.r{background:var(--y);border:2px solid var(--ink)}
.ruta small,.qrflow small{color:var(--muted);font-size:11.5px}
.ruta b{font-size:18px}
.ruta i,.qrflow i{font-style:normal;font-size:24px;font-weight:800}
.qrflow span{font-size:12.5px}
.qr{width:96px;height:96px;margin:4px 0}
code.c1{background:#e3f6ea!important;color:#16653a!important}
code.c2{background:#e8f0fe!important;color:#1967d2!important}
code.c3{background:#fff0ea!important;color:#c2410c!important}
code.c4{background:#f1effd!important;color:#5b3fd1!important}
code.c5{background:#fde8e4!important;color:#c5221f!important}
.ifd{display:flex;flex-direction:column;align-items:center;margin:6px 0 16px}
.ifd .q{background:var(--y);border:3px solid var(--ink);border-radius:14px;padding:10px 16px;font-weight:800;text-align:center;position:relative}
.ifd .br{display:flex;gap:40px;margin-top:22px;position:relative}
.ifd .br:before{content:"";position:absolute;top:-22px;left:25%;right:25%;height:18px;border:3px solid var(--ink);border-bottom:0;border-radius:10px 10px 0 0}
.ifd .br div{display:flex;flex-direction:column;align-items:center;border-radius:12px;padding:8px 18px;border:3px solid}
.ifd .si{background:#fde8e4;border-color:#c5221f!important;color:#c5221f}
.ifd .no{background:#e3f6ea;border-color:#16653a!important;color:#16653a}
.ifd small{font-weight:800}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.ctrls>div{display:flex;flex-direction:column;align-items:center;gap:8px;background:#f2f5fb;border-radius:12px;padding:12px;text-align:center}
.ctrls span{font-size:13px;color:var(--muted)}
.clk{width:64px;height:64px}
.cal2{display:grid;grid-template-columns:repeat(7,18px);gap:3px}
.cal2 i{font-style:normal;font-size:10px;background:#fff;border-radius:4px;padding:2px 0}
.cal2 i.on{background:#1a73e8;color:#fff;font-weight:700}
.kp{display:grid;grid-template-columns:repeat(5,22px);gap:3px}
.kp i{font-style:normal;font-size:12px;background:#fff;border:1px solid #dadce0;border-radius:4px;padding:2px 0;font-weight:700}
.ebtns.big span{font-size:12px;padding:6px 8px}
.two{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.mt{background:#f6f8fc;border-radius:12px;padding:8px 10px}
.mt table{font-size:12.5px}
.mt td,.mt th{padding:5px 8px!important;white-space:nowrap}
.mt tr.hl td{background:#fff6d8}
.tn{display:inline-block;border-radius:6px;padding:2px 8px;font-size:13px;margin-bottom:4px}
.tn.lg{background:#e3f6ea;color:#16653a}.tn.ss{background:#e8f0fe;color:#1967d2}
.st{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;font-size:10px;font-weight:800;margin-right:5px}
.arr{font-style:normal;font-size:26px;font-weight:800}
.pasos{margin:12px 0 0;padding-left:22px;font-size:14px}
.pasos li{margin:3px 0}
code.lg{background:#e3f6ea!important;color:#16653a!important}
code.ss{background:#e8f0fe!important;color:#1967d2!important}
code.op{background:#fff0ea!important;color:#c2410c!important}
code.fn{background:#f1effd!important;color:#5b3fd1!important}
code.tx{background:#fde8e4!important;color:#c5221f!important}
.ley{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;margin:-4px 0 10px;color:var(--muted)}
.sw{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #dadce0}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.huntm{display:flex;align-items:center;gap:10px;background:#ffffffe6;border:3px dashed var(--ink);border-radius:14px;padding:10px 14px;font-weight:600;font-size:15px}
.huntm svg{width:26px;height:30px;flex:0 0 auto;animation:tap 1s infinite}
.slots{display:grid;gap:7px}
.slot{display:flex;gap:10px;align-items:center;min-height:42px;border:2px dashed #b9c2d8;border-radius:12px;padding:7px 10px;background:#ffffffd9;color:var(--muted);font-size:14px}
.slot.f{border-style:solid;border-color:var(--ok);background:var(--ok-soft);color:#16653a;font-weight:600}
.slot i{font-style:normal;flex:0 0 24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pool .opt{padding:8px 12px;font-size:14px}
.stars{font-size:38px;letter-spacing:4px;color:#ffb800;line-height:1;text-shadow:0 3px 0 var(--ink)}
.stars s{color:#d5dbea;text-decoration:none}
.badge-l{font-weight:800;font-size:18px;margin:10px 0 2px}

.banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:30}
.banner div{background:var(--y);border:4px solid var(--ink);box-shadow:0 8px 0 var(--ink);border-radius:22px;padding:18px 34px;text-align:center;animation:pop 1.5s forwards}
.banner b{display:block;font-size:clamp(28px,5vw,44px);font-weight:800;line-height:1.1}
.banner small{font-size:16px;font-weight:600}
@keyframes pop{0%{transform:scale(.3) rotate(-6deg);opacity:0}18%{transform:scale(1.08) rotate(2deg);opacity:1}28%{transform:scale(1) rotate(0)}82%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:0}}

const CARD_FUNC=`<h3>Funciones: la caja de herramientas de AppSheet</h3><p class="sub">AppSheet trae funciones propias, ya listas. Cada una hace una tarea. Estas son las básicas.</p><table><tr><th>Tipo</th><th>Funciones</th><th>Para qué</th></tr><tr><td>Tiempo</td><td><code>NOW()</code> <code>TODAY()</code> <code>TIMENOW()</code> <code>TOTALMINUTES()</code></td><td style="font-weight:400">Fechas, horas y duraciones</td></tr><tr><td>Decisión</td><td><code>IF()</code></td><td style="font-weight:400">Elegir un valor según una pregunta</td></tr><tr><td>Búsqueda</td><td><code>LOOKUP()</code></td><td style="font-weight:400">Traer un dato de otra tabla</td></tr><tr><td>Usuario</td><td><code>USEREMAIL()</code></td><td style="font-weight:400">Saber quién usa la app</td></tr><tr><td>Códigos</td><td><code>UNIQUEID()</code></td><td style="font-weight:400">Crear un código que no se repite</td></tr><tr><td>Texto</td><td><code>CONCATENATE()</code></td><td style="font-weight:400">Unir textos</td></tr></table><p class="rule">Hay muchas más. Cuando escribes una fórmula, AppSheet abre un asistente (Expression Assistant) que muestra las funciones con ejemplos. Explóralo según lo que necesite tu app.</p>`;
const CARD_PUNTO=`<h3>¿Cómo encuentra la app la hora de inicio?</h3><p class="sub">En tres pasos, saltando de una tabla a otra.</p><div class="two"><div class="mt"><b class="tn lg">Tabla “Llegadas”</b><table><tr><th>ID_Llegada</th><th>ID_Sesion</th><th>hora_llegada</th></tr><tr class="hl"><td>L001</td><td><span class="st">1</span>S001</td><td>07:08</td></tr><tr><td>L002</td><td>S002</td><td>06:57</td></tr></table></div><i class="arr">→</i><div class="mt"><b class="tn ss">Tabla “Sesiones”</b><table><tr><th>ID_Sesion</th><th>asignatura</th><th>hora_inicio</th></tr><tr class="hl"><td><span class="st">2</span>S001</td><td>Matemáticas</td><td><span class="st">3</span>07:00</td></tr><tr><td>S002</td><td>Ciencias</td><td>07:00</td></tr></table></div></div><ol class="pasos"><li>En “Llegadas”, la llegada de Camila (L001) dice en ID_Sesion: <b>S001</b>.</li><li>La app busca <b>S001</b> en la tabla “Sesiones”.</li><li>En esa fila lee hora_inicio: <b>07:00</b>.</li></ol><p class="rule">Esos tres pasos se escriben así: <code class="lg">[ID_Sesion]</code><b> . </b><code class="ss">[hora_inicio]</code>. Primero la columna de “Llegadas” que conecta, luego un punto, luego la columna que quieres de “Sesiones”.</p>`;
const CARD_DUR=`<h3>Restar horas da un tiempo, no un número</h3><p class="sub">Si solo restas, el resultado sale en formato horas:minutos:segundos.</p><div class="ruta"><div><small>Resta</small><b>07:08 − 07:00</b></div><i>=</i><div><small>Resultado (HH:MM:SS)</small><b>00:08:00</b></div><i>→</i><div><small>Función</small><b>TOTALMINUTES( )</b></div><i>=</i><div class="r"><small>Número de minutos</small><b>8</b></div></div><p class="rule">Por eso usamos la función TOTALMINUTES: convierte ese tiempo en un número que se puede comparar con 5.</p>`;

const CARD_TRAD=`<h3>De la vida real a AppSheet</h3><p class="sub">Lo que hiciste con lápiz, pieza por pieza. El color dice de dónde sale cada pieza.</p>${LEYENDA}<table><tr><th>En la vida real</th><th>En AppSheet</th><th>Qué significa</th></tr><tr><td style="font-weight:400">La hora en que llegó Camila: 07:08</td><td><code class="lg">[hora_llegada]</code></td><td style="font-weight:400">Columna de la tabla “Llegadas”</td></tr><tr><td style="font-weight:400">La hora en que empezó su clase: 07:00</td><td><code class="lg">[ID_Sesion]</code>.<code class="ss">[hora_inicio]</code></td><td style="font-weight:400">Va por ID_Sesion (de “Llegadas”) y trae hora_inicio (de “Sesiones”)</td></tr><tr><td style="font-weight:400">Restar</td><td><code class="op">-</code></td><td style="font-weight:400">Operador: el signo menos</td></tr><tr><td style="font-weight:400">Decirlo en minutos</td><td><code class="fn">TOTALMINUTES( )</code></td><td style="font-weight:400">Función: convierte 00:08:00 en 8</td></tr></table><p class="rule">Todo junto: <code class="fn">TOTALMINUTES(</code><code class="lg">[hora_llegada]</code> <code class="op">-</code> <code class="lg">[ID_Sesion]</code>.<code class="ss">[hora_inicio]</code><code class="fn">)</code><br>Con los datos de Camila: TOTALMINUTES( 07:08 − 07:00 ) = TOTALMINUTES( 00:08:00 ) = <b>8</b></p>`;
const CARD_IF=`<h3>IF: una pregunta, dos caminos</h3><p class="sub">IF significa si. La app hace una pregunta y, según la respuesta, escribe una cosa u otra.</p><div class="ifd"><div class="q">¿minutos_retraso es más de 5?</div><div class="br"><div class="si"><small>Sí</small><b>"Retardo"</b></div><div class="no"><small>No</small><b>"A tiempo"</b></div></div></div><table><tr><th>En la vida real</th><th>En AppSheet</th></tr><tr><td style="font-weight:400">Si llega más de 5 minutos tarde…</td><td><code class="ss">IF([minutos_retraso] &gt; 5,</code></td></tr><tr><td style="font-weight:400">…es Retardo…</td><td><code class="tx">"Retardo",</code></td></tr><tr><td style="font-weight:400">…si no, A tiempo.</td><td><code class="lg">"A tiempo")</code></td></tr></table><p class="rule">Camila: 8 &gt; 5 → Sí → <b>Retardo</b>. Laura: 3 &gt; 5 → No → <b>A tiempo</b>.</p>`;
const CARD_RESUMEN=`<h3>Resumen: las dos columnas calculadas</h3><p class="sub">Así quedan en la tabla “Llegadas”.</p><table><tr><th></th><th>minutos_retraso</th><th>estado</th></tr><tr><td>Tipo de dato</td><td style="font-weight:400">Number</td><td style="font-weight:400">Enum</td></tr><tr><td>App formula</td><td><code>TOTALMINUTES([hora_llegada] - [ID_Sesion].[hora_inicio])</code></td><td><code>IF([minutos_retraso] &gt; 5, "Retardo", "A tiempo")</code></td></tr><tr><td>¿Qué hace?</td><td style="font-weight:400">Resta las horas y da el número de minutos, por ejemplo 8</td><td style="font-weight:400">Mira la columna anterior: si es más de 5, pone "Retardo"; si no, "A tiempo"</td></tr></table>`;

const CARD_QR=`<h3>Así se registra una llegada</h3><p class="sub">Cada clase (cada fila de Sesiones) tiene su propio código, ID_Sesion. Ese código va dentro del QR.</p><div class="qrflow"><div><small>Tablero del salón</small>${fakeQR()}<b>Clase S001</b><span>Matemáticas 7B · 07:00</span></div><i>→</i><div><small>Celular de Camila</small><b>Escanea el QR</b><span>ID_Sesion: S001</span><span>Estudiante: Camila (por su correo)</span><span>Hora: 07:08</span></div></div><p class="rule">La app puede mostrar el QR de cada clase en la pantalla de la sesión, para que el docente lo proyecte.</p>`;
function fakeQR(){let seed=7;const r=()=>(seed=(seed*9301+49297)%233280)/233280;let s='';const fin=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#152039"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#152039"/>`;for(let y=0;y<21;y++)for(let x=0;x<21;x++){if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12))continue;if(r()>.5)s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#152039"/>`}return `<svg class="qr" viewBox="-1 -1 23 23"><rect x="-1" y="-1" width="23" height="23" fill="#fff"/>${s}${fin(0,0)}${fin(14,0)}${fin(0,14)}</svg>`}
const CARD_INIT=`<h3>Campos que se llenan solos</h3><p class="sub">Se configuran en cada columna de la tabla.</p><table><tr><th>Ajuste</th><th>Qué hace</th></tr><tr><td><code>USEREMAIL()</code></td><td style="font-weight:400">Correo de quien usa la app</td></tr><tr><td><code>TIMENOW()</code></td><td style="font-weight:400">Hora exacta del momento</td></tr><tr><td><code>TODAY()</code></td><td style="font-weight:400">Fecha de hoy</td></tr><tr><td><code>UNIQUEID()</code></td><td style="font-weight:400">Código que nunca se repite</td></tr><tr><td><code>LOOKUP( )</code></td><td style="font-weight:400">Busca un dato en otra tabla. Ej.: busca el correo en Estudiantes y trae el código</td></tr><tr><td>Require</td><td style="font-weight:400">Campo obligatorio</td></tr><tr><td>Scannable</td><td style="font-weight:400">Permite escanear un QR con la cámara</td></tr></table>`;

const CARD_POR_QUE=`<h3>¿Por qué el ID y no el nombre?</h3><p class="sub">Piensa en la placa de un carro: en un parqueadero anotan solo la placa. Con ella buscan en el registro la marca, el modelo y el color. La placa no se repite; el color sí.</p><table><tr><th>Si escribes el nombre en cada llegada</th><th>Si escribes solo el ID</th></tr><tr><td style="font-weight:400">El nombre de Camila se escribe en cada llegada (¡50 veces en el año!) y alguien puede escribir "camila torres" o "Camila Tores"</td><td>EST001 siempre es igual</td></tr><tr><td style="font-weight:400">Si Camila cambia de correo, hay que corregir 50 filas</td><td>Se corrige una vez, en Estudiantes</td></tr><tr><td style="font-weight:400">Dos Camilas se confunden</td><td>Cada una tiene su propio ID</td></tr></table>`;

function keySheet(dup){
 const R=[['L001','EST001','07:08'],['L002','EST002','06:57'],[dup?'L002':'L003','EST001','07:10'],['L004','EST003','07:03']];
 const H=['ID_Llegada','ID_Estudiante','hora_llegada'];
 return `<div class="sh"><div class="sh-bar"><span class="sh-ico"></span><span class="sh-name">Retardos · datos</span></div><div class="sh-wrap"><table class="sh-grid"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr class="h"><td class="n">1</td>${H.map((h,i)=>`<td ${i?'':'data-t="keycol"'}>${h}${i?'':' <span class="ty new">Key</span>'}</td>`).join('')}</tr>${R.map((r,k)=>{const d=dup&&r[0]==='L002';return `<tr data-hot="${d?'dup':'ok'+k}" ${d&&k===2?'data-t="duprows"':''}><td class="n">${k+2}</td>${r.map((c,i)=>`<td ${i===0&&d?'style="background:#fde8e4;color:#c5221f;font-weight:700"':''}>${c}</td>`).join('')}</tr>`}).join('')}</table></div><div class="sh-tabs">${Object.keys(SHEETS).map(t=>`<span class="${t==='Llegadas'?'on':''}">${t}</span>`).join('')}</div></div>`;
}

  {t:'choice',code:1,q:'Las llegadas se registran desde el celular. ¿Qué escribes en Initial value de ID_Llegada?',opts:['UNIQUEID()','"L001"','NOW()'],ok:0,hint:'Necesitas la máquina de turnos que nunca repite.',good:'UNIQUEID() da un código nuevo en cada registro.',why:{1:'Todas las llegadas tendrían el mismo código.',2:'NOW() da la fecha y hora, no un código.'},apply:ms=>{ms.view='keyset';ms.uid=true}},
  {t:'choice',q:'¿Quien registra la llegada debe ver y escribir ID_Llegada?',opts:['No: se oculta apagando Show','Sí, y debe escribirlo'],ok:0,hint:'El código ya se genera solo.',good:'Oculto y automático: menos trabajo y cero errores.',apply:ms=>ms.hide=true},
  {t:'choice',q:'Dos estudiantes escanean el QR en el mismo segundo. ¿Se puede repetir el código?',opts:['No, UNIQUEID() da códigos distintos','Sí, si registran al tiempo'],ok:0,hint:'Unique significa único.',good:'Cada registro tiene su código, aunque se creen al mismo tiempo.'}
 ]},
{short:'Relaciones',badge:'Maestra de relaciones',title:'Relaciones entre tablas',ask:['relacion','ref','label','related'],
 tourInit:{view:'diagram',type:false,src:false,lbl:false,glow:false},init:{view:'diagram',type:false,src:false,lbl:false,glow:false},
 tour:[
  {s:'Las tablas no viven solas: se conectan. Es el tema más importante de tu app, así que vamos despacio.'},
  {s:'En “Estudiantes”, cada estudiante aparece una sola vez, con su código único (su Key). EST001 es Camila.',t:'estT'},
  {s:'En “Llegadas”, Camila aparece muchas veces: una por cada día que llega. Pero no se escribe su nombre: se escribe su código, EST001.',t:'llegT'},
  {s:'Mira los colores: cada llegada de Camila lleva el mismo código. Ese código es el puente entre las dos tablas.',set:ms=>ms.glow=true,t:'llegT'},
  {s:'Esto se llama relación uno a muchos: un estudiante tiene muchas llegadas, y cada llegada es de un solo estudiante.',set:ms=>ms.glow=true,t:'relb'},
  {s:'¿Por qué escribir el código y no el nombre? Este cuadro lo explica.',card:CARD_POR_QUE},
  {s:'Ahora la parte clave. Para nosotros es obvio que EST001 es Camila. Pero AppSheet no lo sabe: para él, EST001 es solo un texto, como cualquier palabra.',set:ms=>ms.glow=true,t:'llegT'},
  {s:'Hay que decirle: este código pertenece a la tabla “Estudiantes”. Para eso existe un tipo de dato llamado Ref, de referencia. Significa: este valor es el código de otra tabla.',set:ms=>ms.glow=true,t:'relb'},
  {s:'Esa conexión entre tablas se hace en dos pasos. Paso 1: en Data abres la tabla “Llegadas” y tocas la columna ID_Estudiante. En Type (tipo de dato) eliges Ref, porque ese tipo es el que se encarga de conectar tablas.',set:ms=>{ms.view='col';ms.type=true},t:'rtype'},
  {s:'Paso 2: en Source table (tabla de origen) eliges “Estudiantes”, la tabla donde está guardado ese código con todos sus datos. Así AppSheet sabe de qué tabla es el código.',set:ms=>{ms.view='col';ms.type=true;ms.src=true},t:'rsrc'},
  {s:'¡Ya están conectadas! Mira el celular: el código ahora es un enlace azul; si lo tocas, abre la pantalla del estudiante. Pero sale el código, y nadie se sabe los códigos de memoria.',set:ms=>{ms.view='col';ms.type=true;ms.src=true},t:'phone'},
  {s:'Para eso existe Label (etiqueta): es la columna que la app muestra como nombre visible de cada registro. En la tabla “Estudiantes” marcas Label en la columna nombre. Así la app muestra el nombre de la persona y no su código.',set:ms=>{ms.view='label';ms.type=true;ms.src=true;ms.lbl=true},t:'lblcell'},
  {s:'Ahora, en todas las pantallas aparece Camila Torres en vez de EST001: en las listas, en los detalles y en los reportes.',set:ms=>{ms.view='label';ms.type=true;ms.src=true;ms.lbl=true},t:'phone'},
  {s:'Y hay un regalo extra. Como “Llegadas” apunta a “Estudiantes”, AppSheet crea sola, en “Estudiantes”, una columna llamada Related Llegadas (llegadas relacionadas).',set:ms=>{ms.view='related'},t:'relrow'},
  {s:'¿Para qué sirve? Al abrir la pantalla de Camila ves todo su historial de llegadas, sin buscarlas una por una.',set:ms=>{ms.view='related'},t:'phone'},
  {s:'¿Por qué en “Estudiantes” y no en otra tabla? AppSheet la crea siempre en la tabla a la que apunta la Ref. “Llegadas” también apunta a “Sesiones”, porque cada llegada es a una clase (columna ID_Sesion). Así que “Sesiones” también tendrá su propia lista: todos los que llegaron a esa clase.',set:ms=>{ms.view='related'}},
  {s:'Este es el mapa de relaciones de la app del ejemplo. Fíjate en la regla de abajo.',card:CARD_MAPA},
  {s:'En tu proyecto: busca qué se repite muchas veces y, en esa tabla, pon una columna Ref hacia la tabla donde el dato aparece una sola vez.'}
 ],
 sim:ms=>relSim(ms),
 steps:[

  {t:'hot',q:'Toca en “Llegadas” una llegada de Camila (EST001).',ok:'lleg-EST001',hint:'Busca el código del mismo color que Camila.',good:'Esa es de Camila: tiene su código, EST001.',bad:'Esa llegada es de otra persona. Busca EST001.'},
  {t:'choice',q:'¿Qué significa el tipo de dato Ref?',opts:['Que el valor es el código de otra tabla','Que el valor es un número','Que la columna es obligatoria'],ok:0,hint:'Ref viene de referencia.',good:'Ref dice: este valor es el código de otra tabla.'},
  {t:'choice',q:'¿En qué tabla va la columna Ref?',opts:['En Llegadas, donde el código se repite','En Estudiantes, donde el código aparece una vez','En las dos tablas'],ok:0,hint:'¿Dónde se repite EST001 muchas veces?',good:'La Ref va donde el código se repite: en “Llegadas”.',why:{1:'En Estudiantes está la Key, no la Ref.',2:'Basta con una Ref. AppSheet crea el camino de regreso sola.'}},
  {t:'choice',q:'En la tabla “Llegadas”, la columna ID_Estudiante guarda el código de Camila. ¿Cómo la configuras para conectarla con “Estudiantes”?',opts:['Type: Ref y Source table: Estudiantes','Type: Text y Source table: Llegadas','Type: Ref y Source table: Llegadas'],ok:0,hint:'El tipo es Ref y la tabla de origen es donde está Camila con sus datos.',good:'Listo: “Llegadas” quedó conectada con “Estudiantes”.',why:{1:'Como Text no queda conectada con nada.',2:'No apunta a sí misma: apunta a la tabla de los estudiantes.'},apply:ms=>{ms.view='col';ms.type=true;ms.src=true}},
  {t:'choice',q:'La lista muestra EST001 en vez de Camila Torres. ¿Qué arreglas?',opts:['Marcar Label en la columna nombre de Estudiantes','Cambiar ID_Estudiante a Text','Borrar la columna ID'],ok:0,hint:'Label es el nombre visible de cada registro.',good:'Ahora la lista muestra nombres.',apply:ms=>{ms.view='label';ms.lbl=true}},
  {t:'choice',q:'¿Para qué sirve Related Llegadas en “Estudiantes”?',opts:['Para ver todas las llegadas de un estudiante en su pantalla','Para borrar llegadas','Para cambiar el código'],ok:0,hint:'Es el camino de regreso: de Camila a sus llegadas.',good:'Es el historial de llegadas de cada estudiante.',apply:ms=>ms.view='related'}
 ]},
{short:'Fórmulas',badge:'Modo cálculo',title:'Fórmulas que calculan solas',ask:['formula','if','ref'],
 init:{f1:false,f2:false},tourInit:{f1:false,f2:false},
 tour:[
  {s:'Algunos datos no los escribe nadie: la app los calcula, como una calculadora. Eso se llama fórmula.'},
  {s:'Mira la lista: no dice cuántos minutos tarde llegó cada uno, ni si fue retardo. Vamos a hacer que la app lo calcule.',t:'phone'},
  {s:'Primero, piensa como persona. Camila llegó a las 07:08 y la clase empezaba a las 07:00. Restas y te da 8 minutos.',card:CARD_RESTA},
  {s:'Para decirle eso a la app hay que escribirlo en su idioma. Estas son las reglas para escribir fórmulas. Son pocas.',card:CARD_REGLAS},
  {s:'AppSheet trae funciones propias, ya listas, como las herramientas de una caja. Estas son las básicas.',card:CARD_FUNC},
  {s:'¿Dónde está cada dato? La hora de llegada está en la tabla “Llegadas”. La hora de inicio está en otra tabla, “Sesiones”. Mira cómo la app la encuentra en tres pasos.',card:CARD_PUNTO},
  {s:'Si solo restas las dos horas, el resultado sale como un tiempo: 00:08:00. Para tener solo el número 8, usamos la función TOTALMINUTES.',card:CARD_DUR},
  {s:'Ahora traducimos lo que hiciste con lápiz al idioma de AppSheet, pieza por pieza. El color dice de qué tabla sale cada dato.',card:CARD_TRAD},
  {s:'¿Dónde se escribe? En Data abres la tabla “Llegadas” y tocas la columna minutos_retraso. En su configuración hay un espacio llamado App formula (fórmula de la app). Ahí va, sin el signo = al principio.',set:ms=>ms.f1=true,t:'f1'},
  {s:'Mira el celular: ya aparecen los minutos de cada llegada.',set:ms=>ms.f1=true,t:'phone'},
  {s:'Ahora el estado. Piensa como persona: si llega más de 5 minutos tarde, es Retardo; si no, A tiempo. Mira el diagrama: una pregunta y dos caminos.',card:CARD_IF},
  {s:'Esa fórmula va en App formula de la columna estado.',set:ms=>{ms.f1=true;ms.f2=true},t:'f2'},
  {s:'Mira el celular: los minutos y el estado aparecen solos en cada llegada.',set:ms=>{ms.f1=true;ms.f2=true},t:'phone'},
  {s:'Este cuadro resume las dos columnas calculadas. Tenlo a la mano para los retos.',card:CARD_RESUMEN},
  {s:'En tu proyecto: busca qué datos se pueden calcular en vez de escribirse, como totales, días o estados.'}
 ],
 sim:ms=>editor('data',`<h4>Llegadas · minutos_retraso</h4>${fld('Type (tipo de dato)','Number')}${fld('App formula (fórmula de la app)',ms.f1?'TOTALMINUTES([hora_llegada] - [ID_Sesion].[hora_inicio])':'?',ms.f1?'set':'empty','f1')}<h4 style="margin-top:16px">Llegadas · estado</h4>${fld('Type (tipo de dato)','Enum')}${fld('App formula (fórmula de la app)',ms.f2?'IF([minutos_retraso] > 5, "Retardo", "A tiempo")':'?',ms.f2?'set':'empty','f2')}`,phone('llegadas',{min:ms.f1,est:ms.f2})),
 steps:[
  {t:'choice',q:'Laura llegó a las 07:03 y la clase empezaba a las 07:00. ¿Cuántos minutos tarde?',opts:['3','7','0'],ok:0,hint:'Resta: 07:03 menos 07:00.',good:'3 minutos.'},
  {t:'choice',q:'Con 5 minutos de tolerancia, ¿qué estado tiene Laura?',opts:['A tiempo','Retardo'],ok:0,hint:'¿3 es más que 5?',good:'3 no es más que 5: A tiempo.'},
  {t:'choice',code:1,q:'¿Cómo se escribe en AppSheet la hora en que llegó el estudiante?',opts:['[hora_llegada]','hora_llegada()','"07:08"'],ok:0,hint:'El nombre de una columna va entre corchetes.',good:'Los corchetes encierran el nombre de la columna.'},
  {t:'choice',code:1,q:'La hora de inicio está en la tabla “Sesiones”. ¿Cómo la traes?',opts:['[ID_Sesion].[hora_inicio]','[hora_inicio]','TOTALMINUTES([hora_inicio])'],ok:0,hint:'El punto trae un dato de otra tabla, pasando por la clase de la llegada.',good:'Ve a la sesión de esta llegada y trae su hora de inicio.',why:{1:'Llegadas no tiene esa columna: está en Sesiones.'}},
  {t:'choice',q:'Si solo restas las horas, el resultado sale como 00:08:00. ¿Qué función lo convierte en el número 8?',opts:['TOTALMINUTES()','IF()','LOOKUP()'],ok:0,hint:'Mira la caja de herramientas: funciones de tiempo.',good:'TOTALMINUTES convierte un tiempo en minutos.'},
  {t:'choice',code:1,q:'Junta las piezas. ¿Cuál es la fórmula de minutos_retraso?',opts:['TOTALMINUTES([hora_llegada] - [ID_Sesion].[hora_inicio])','[hora_llegada] + [hora_inicio]','SUM(hora_llegada)'],ok:0,hint:'Llegada menos inicio, y todo en minutos.',good:'¡Esa es! La app ya calcula los minutos.',apply:ms=>ms.f1=true},
  {t:'choice',code:1,q:'Si pasa de 5 minutos es Retardo; si no, A tiempo. ¿Qué fórmula lo dice?',opts:['IF([minutos_retraso] > 5, "Retardo", "A tiempo")','IF([minutos_retraso] < 5, "Retardo", "A tiempo")','IF([estado] > 5, "A tiempo")'],ok:0,hint:'Primero la pregunta, luego el camino del sí y al final el del no.',good:'¡Perfecto! El estado se calcula solo.',why:{1:'Así marcaría Retardo a quien llega a tiempo.',2:'estado no se calcula a partir de sí mismo.'},apply:ms=>ms.f2=true}
 ]},

  {s:'Este cuadro muestra las funciones que llenan campos solas. Son tu caja de herramientas.',card:CARD_INIT},

 ],

/* ---------- Estado ---------- */
const KEY='aprende-appsheet-v7';
const def=()=>({xp:0,done:{},stars:{},mute:false});
function load(){try{return Object.assign(def(),JSON.parse(localStorage.getItem(KEY))||{})}catch(e){return def()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load(),cur=-1,ms=null,tw=null;
const unlocked=i=>i===0||!!S.done[i-1]||!!S.done[i];
const doneCount=()=>Object.keys(S.done).length;

/* ---------- Sonido ---------- */
let AC=null;
function tone(f,d,when=0,type='triangle',vol=.12){if(S.mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+when;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={ok:()=>{tone(660,.12);tone(990,.18,.1)},bad:()=>tone(170,.25,0,'square',.06),win:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.22,i*.11)),next:()=>tone(520,.06,0,'sine',.06)};
const ICS={on:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>',off:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="m17 9 5 6M22 9l-5 6"/>'};
function drawSnd(){$('#snd').innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${S.mute?ICS.off:ICS.on}</svg>`}
$('#snd').onclick=()=>{S.mute=!S.mute;save();drawSnd()};

/* ---------- HUD ---------- */
const nameIn=t=>t.replace('{n}',S.name?', '+S.name:'');
function hud(sub){
 $('#bar').style.width=(doneCount()/M.length*100)+'%';
 $('#xp').firstChild.textContent=(S.name?S.name+' · ':'')+S.xp+' XP';
 if(sub!==undefined)$('#hsub').textContent=sub;
}
function xpFloat(n){const s=document.createElement('span');s.className='xpf';s.textContent='+'+n;$('#xp').appendChild(s);setTimeout(()=>s.remove(),1000)}

/* ---------- Mapa ---------- */
function home(){
 cur=-1;stopVoice();clearInterval(tw);
 const next=M.findIndex((_,i)=>!S.done[i]);
 const started=doneCount()>0;
 const offs=[0,-80,0,80];
 let k=0;
 const node=i=>{const m=M[i];const st=S.done[i]?'done':i===next?'cur':'';const x=offs[(k++)%4];return `<button type="button" class="node ${st}" data-i="${i}" style="--x:${x}px" ${unlocked(i)?'':'disabled'}><span class="nb">${S.done[i]?'✓':i+1}</span><span class="nl">${m.short}</span><span class="ns">${S.stars[i]?'★'.repeat(S.stars[i])+'☆'.repeat(3-S.stars[i]):''}</span></button>`};
 const dots='<div class="dots3"><i></i><i></i></div>';
 const zone=(z)=>{const L=LEVELS[z];const ids=[];for(let i=L[1];i<=L[2];i++)ids.push(i);
  return `<section class="zone sky${z+1}"><div class="scene">${scene(z+1)}</div><div class="zin">${z===0?`<div class="mhero"><div class="av">${avatar()}</div><div><h1>Aprende AppSheet</h1>${S.name?`<p class="who">Jugador: <b>${esc(S.name)}</b> · ${S.xp} XP</p>`:`<label class="who" for="nm">¿Cómo te llamas?</label><input id="nm" class="nm" maxlength="20" autocomplete="off" placeholder="Escribe tu nombre">`}<div class="row2"><button class="gbtn" id="start" type="button">${next<0?'Ver mi app completa':started?'Continuar etapa '+(next+1):'Empezar'}</button></div></div></div>`:''}<div style="text-align:center"><span class="ztitle"><b>Nivel ${L[0]}</b><small>${L[3]}</small></span></div><div class="path">${ids.map(node).join(dots)}${z===2?dots+`<button type="button" class="node trophy" id="trophy" style="--x:0px" ${next<0?'':'disabled'}><span class="nb">🏆</span><span class="nl">Tu app</span></button>`:''}</div>${z===2&&started?'<button class="resetl" id="reset" type="button">Reiniciar progreso</button>':''}</div></section>`};
 const main=$('#main');main.className='';
 main.innerHTML=`<div class="mapv" id="mapv">${[0,1,2].map(zone).join('')}</div>`;
 main.querySelectorAll('.node[data-i]').forEach(b=>b.onclick=()=>go(+b.dataset.i));
 const nm=$('#nm');if(nm){$('#start').disabled=true;nm.oninput=()=>{$('#start').disabled=!nm.value.trim()}}
 $('#start').onclick=()=>{if(nm){S.name=nm.value.trim().slice(0,20);save();hud()}next<0?final():go(next)};
 $('#trophy').onclick=final;
 const r=$('#reset');if(r)r.onclick=()=>{if(confirm('¿Borrar tu progreso y empezar de cero?')){const mu=S.mute,nn=S.name;S=def();S.mute=mu;S.name=nn;save();home()}};
 hud(started?`${doneCount()} de ${M.length} etapas`:'Elige tu etapa');setSugg(['appsheet','miapp','gratis']);
 if(next>2){const n=main.querySelector('.node.cur');if(n)n.scrollIntoView({block:'center'})}
}

/* ---------- Etapa ---------- */
function go(i){
 if(!unlocked(i))return;
 cur=i;stopVoice();
 const m=M[i],z=lvl(i)+1;
 const main=$('#main');main.className='stage sky'+z;
 main.innerHTML=`<div class="scene">${scene(z)}</div>
 <div class="simarea" id="simarea"><div class="device"><div class="simwrap" id="simwrap"><div id="simc"></div><div class="spot" id="spot"></div><div class="ptr" id="ptr">${PTR}</div><div class="card" id="card" hidden></div></div></div></div>
 <aside class="comp" id="comp"><div class="portrait" id="portrait">${avatar()}</div><div class="dlg" id="dlg"><span class="tag" id="tag"></span><div id="dbody"></div></div><div id="dextra"></div></aside>
 <div class="banner" id="banner"></div><div class="confetti" id="conf"></div>`;
 $('#simwrap').addEventListener('click',onSimClick);
 $('#dlg').addEventListener('click',e=>{if(e.target.id==='say'||e.target.closest('#say'))finishType()});
 hud(`Nivel ${LEVELS[lvl(i)][0]} · Etapa ${i+1}: ${m.title}`);setSugg(m.ask);
 ms={phase:'tour',line:0};
 if(i===LEVELS[lvl(i)][1]&&!S.done[i])levelIntro(lvl(i));else showLine(0);
 const L0=LEVELS[lvl(i)];if(ms.phase==='intro')sfx.win();else banner(`Nivel ${L0[0]}`,`Etapa ${i+1} de ${M.length} · ${L0[3]}`,1800);
}
function levelIntro(l){
 ms=Object.assign(stateFor(0),{phase:'intro',line:0});
 drawSim();spot(null);
 const card=$('#card');card.innerHTML=lvCard(l);card.hidden=false;card.scrollTop=0;
 $('#tag').innerHTML=tagHTML('Profe Vivy');
 $('#dbody').innerHTML=`<p class="say" id="say"></p><div class="ctrl"><span class="sp"></span>${speakBtn()}<button class="gbtn" id="next" type="button">¡Empecemos!</button></div>`;
 $('#dextra').innerHTML='';
 typeText(LVINTRO[l].say);bindSpeak(()=>nameIn(LVINTRO[l].say));
 $('#next').onclick=()=>{sfx.next();showLine(0)};
}
function stateFor(k){const m=M[cur];const st=clone(m.tourInit||m.init);const L=m.tour[k];if(L.set)L.set(st);return st}
const tagHTML=t=>avatar()+'<span>'+t+'</span>';
function drawSim(){
 const st=ms.phase==='play'?M[cur].steps[ms.step]:null;
 $('#simc').innerHTML=M[cur].sim(ms);
 $('#simwrap').classList.toggle('hunt',!!st&&st.t==='hot'&&!ms.lock);
}
function showLine(k){
 const m=M[cur],L=m.tour[k];
 ms=Object.assign(stateFor(k),{phase:'tour',line:k});
 drawSim();
 const card=$('#card');
 if(L.card){card.innerHTML=L.card;card.hidden=false;card.scrollTop=0}else card.hidden=true;
 requestAnimationFrame(()=>spot(L.card?null:L.t));
 const last=k===m.tour.length-1;
 $('#tag').innerHTML=tagHTML('Profe Vivy');
 $('#dbody').innerHTML=`<p class="say" id="say"></p><div class="ctrl"><div class="dots">${m.tour.map((_,j)=>`<i class="${j===k?'on':''}"></i>`).join('')}</div><span class="sp"></span>${speakBtn()}${k>0?'<button class="gbtn w" id="back" type="button">Atrás</button>':''}<button class="gbtn" id="next" type="button">${last?'¡A los retos!':'Siguiente'}</button></div>`;
 $('#dextra').innerHTML='';
 typeText(L.s);
 bindSpeak(()=>nameIn(L.s));
 if(k>0)$('#back').onclick=()=>{sfx.next();showLine(k-1)};
 $('#next').onclick=()=>{sfx.next();last?startPlay():showLine(k+1)};
}
function typeText(t){
 t=nameIn(t);
 clearInterval(tw);const el=$('#say');let i=0;el.textContent='';el.dataset.full=t;
 tw=setInterval(()=>{i+=2;el.textContent=t.slice(0,i);if(i>=t.length)clearInterval(tw)},18);
}
function finishType(){const el=$('#say');if(el&&el.dataset.full){clearInterval(tw);el.textContent=el.dataset.full}}
function spot(t){
 const wrap=$('#simwrap'),s=$('#spot'),p=$('#ptr');if(!wrap)return;
 const el=t&&(wrap.querySelector(`[data-t="${t}"]`)||wrap.querySelector(`[data-hot="${t}"]`));
 if(!el){s.classList.remove('on');p.classList.remove('on');return}
 el.scrollIntoView({block:'nearest',inline:'nearest'});
 const wr=wrap.getBoundingClientRect(),r=el.getBoundingClientRect(),pad=5;
 Object.assign(s.style,{left:(r.left-wr.left-pad)+'px',top:(r.top-wr.top-pad)+'px',width:(r.width+pad*2)+'px',height:(r.height+pad*2)+'px'});
 const px=Math.min(r.right-wr.left-12,wr.width-36),py=Math.min(r.bottom-wr.top-10,wr.height-42);
 Object.assign(p.style,{left:px+'px',top:py+'px'});
 s.classList.add('on');p.classList.add('on');
}
addEventListener('resize',()=>{if(ms&&ms.phase==='tour'&&cur>=0){const L=M[cur].tour[ms.line];spot(L.card?null:L.t)}});

function banner(t,sub,ms_=1500){const b=$('#banner');if(!b)return;b.innerHTML=`<div><b>${t}</b><small>${sub}</small></div>`;setTimeout(()=>{if(b.isConnected)b.innerHTML=''},ms_)}
function startPlay(){
 const m=M[cur];
 spot(null);$('#card').hidden=true;
 ms=Object.assign(clone(m.init),{phase:'play',step:0,errs:0,se:0,lock:false});
 banner('¡Hora de los retos!',`${m.steps.length} retos · gana XP y estrellas`);
 sfx.win();
 drawTask();
}
function drawTask(){
 const m=M[cur],st=m.steps[ms.step];
 if(!st)return finish();
 ms.se=0;ms.lock=false;
 if(st.tab)ms.tab=st.tab;
 $('#tag').innerHTML=tagHTML(`Reto ${ms.step+1} de ${m.steps.length}`);
 $('#dbody').innerHTML=`<p class="qq">${esc(st.q)}</p><div class="fb" id="fb" aria-live="polite"></div><div class="ctrl" id="acts"><button class="gbtn w" id="hint" type="button">Pista</button><span class="sp"></span><button class="lbtn" id="rev" type="button">Repasar explicación</button></div>`;
 let x='';
 if(st.t==='choice')x=`<div class="opts">${shuffle(st.opts.map((_,k)=>k)).map(k=>`<button type="button" class="opt ${st.code?'code':''}" data-k="${k}">${esc(st.opts[k])}</button>`).join('')}</div>`;
 else if(st.t==='hot')x=`<div class="huntm">${PTR}<span>Toca la respuesta directamente en la pantalla.</span></div>`;
 else if(st.t==='order'){ms.ord=0;x=`<div class="slots">${st.items.map((_,k)=>`<div class="slot" data-s="${k}"><i>${k+1}</i><span></span></div>`).join('')}</div><div class="pool">${shuffle(st.items.map((_,k)=>k)).map(k=>`<button type="button" class="opt" data-o="${k}">${esc(st.items[k])}</button>`).join('')}</div>`}
 $('#dextra').innerHTML=x;
 drawSim();
 $('#hint').onclick=()=>setFb('tip','Pista: '+st.hint);
 $('#rev').onclick=()=>showLine(0);
 if(st.t==='choice')document.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
  if(ms.lock)return;const k=+b.dataset.k;
  if(k===st.ok){b.classList.add('right');document.querySelectorAll('.opt[data-k]').forEach(o=>o.disabled=true);right(st)}
  else{b.classList.add('wrong','shake');b.disabled=true;wrong(st.why&&st.why[k])}
 });

let speaking=false;
const speakBtn=()=>'speechSynthesis' in window?`<button class="spk" id="spk" type="button" aria-label="Escuchar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICS.on}</svg></button>`:'';
function bindSpeak(get){const b=$('#spk');if(!b)return;b.onclick=()=>{if(speaking){stopVoice();return}const u=new SpeechSynthesisUtterance(get());setVoice(u);u.onend=stopVoice;speechSynthesis.cancel();speechSynthesis.speak(u);speaking=true;b.classList.add('on')}}
let VOICE=null,VFEM=false;
function pickVoice(){
 if(!('speechSynthesis' in window))return;
 const vs=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang));
 const fem=/salome|salomé|dalia|sabina|paloma|paulina|m[oó]nica|helena|laura|elvira|elena|luc[ií]a|ximena|marisol|esperanza|conchita|lupe|pen[eé]lope|mia\b|female|mujer|google espa/i;
 const male=/pablo|ra[uú]l|jorge|diego|[aá]lvaro|gonzalo|carlos|juan|enrique|miguel|andr[eé]s|gerardo|tom[aá]s|alonso|jos[eé]|male\b|hombre/i;
 let best=null,bs=-99;
 vs.forEach(v=>{let sc=0;if(fem.test(v.name))sc+=10;if(male.test(v.name))sc-=20;if(/es-CO/i.test(v.lang))sc+=4;else if(/es-(MX|US|419)/i.test(v.lang))sc+=3;if(/natural|online|neural/i.test(v.name))sc+=2;if(sc>bs){bs=sc;best=v}});
 VOICE=best;VFEM=bs>=10;
}
function setVoice(u){if(!VOICE)pickVoice();if(VOICE){u.voice=VOICE;u.lang=VOICE.lang}else u.lang='es-CO';u.pitch=VFEM?1.05:1.35;u.rate=1}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function stopVoice(){if('speechSynthesis' in window)speechSynthesis.cancel();speaking=false;const b=$('#spk');if(b)b.classList.remove('on')}

const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function reply(text){
 const n=norm(text);let best=null,score=0;
 for(const id in KB){let sc=0;KB[id].k.forEach(k=>{if(n.includes(norm(k)))sc+=k.length});if(sc>score){score=sc;best=id}}
 return best?KB[best].a:'Esa no la tengo clara todavía. Prueba con una de las preguntas de abajo o llévala a clase y la resolvemos juntos.';
}
